[project]
name = "gitlab-mcp"
version = "1.0.0"
description = "A Python-based MCP server for GitLab integration using Clean Architecture and FastMCP"
readme = "README.md"
authors = [
    { name = "Markus Kreitzer" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12.4",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "pydantic-ai>=1.0.17",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "python-gitlab>=6.4.0",
    "structlog>=25.4.0",
    "tenacity>=9.1.2",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
 dev = [
     "bandit>=1.7.0",
     "black>=25.9.0",
     "mypy>=1.18.2",
     "pip-audit>=2.7.0",
     "pre-commit>=3.6.0",
     "pytest>=8.4.2",
     "pytest-asyncio>=1.3.0",
     "pytest-cov>=7.0.0",
     "pytest-mock>=3.15.1",
     "respx>=0.22.0",
     "ruff>=0.14.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
